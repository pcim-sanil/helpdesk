[program:laravel-queue]
; Spawn 4 identical worker processes
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/helpdesk/artisan queue:work database \
    --sleep=3 --tries=3 --timeout=600
directory=/var/www/html/helpdesk

; Run as the nginx user (your PHP-FPM and Nginx both already run as nginx)
user=nginx
group=nginx

; Number of processes: change to 4 to match the comment
numprocs=4

; Automatically start on Supervisor boot
autostart=true
; Restart crashed processes
autorestart=true
; Wait up to 1 hour for jobs to finish on stop
stopwaitsecs=3600

; Logging
redirect_stderr=true
stdout_logfile=/var/www/html/helpdesk/storage/logs/worker.log
; Keep each log file at most 50MB, rotate up to 5 old files
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5