image: php:8.4

pipelines:
  default:
    - step:
        name: Install, Migrate & Test (SQLite)
        caches:
          - composer
        script:
          # Update package manager and install required dependencies (including SQLite)
          - apt-get update && apt-get install -y unzip git libzip-dev libpng-dev libonig-dev libxml2-dev zip sqlite3 libsqlite3-dev
          # Install PHP extensions required for Laravel with SQLite support
          - docker-php-ext-install pdo pdo_sqlite zip
          # Install Composer globally
          - curl -sS https://getcomposer.org/installer | php
          - mv composer.phar /usr/local/bin/composer
          # Install Laravel dependencies
          - composer install --prefer-dist --no-interaction
          # Copy environment example and update for SQLite
          - cp .env.example .env
          # Change DB_CONNECTION to sqlite and set DB_DATABASE to the database file location
          - sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          - sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          # Create the SQLite database file if it doesn't exist
          - touch database/database.sqlite
          # Generate the Laravel application key
          - php artisan key:generate
          # Run database migrations (use --force for non-interactive environments)
          - php artisan migrate --force
          # Execute PHPUnit tests by explicitly invoking PHP
          - php vendor/bin/phpunit
        artifacts:
          - storage/logs/**
